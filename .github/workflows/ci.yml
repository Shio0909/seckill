# ========================================================================
# 【重点学习】GitHub Actions CI/CD Pipeline
# ========================================================================
# GitHub Actions 是 GitHub 提供的 CI/CD 服务，用于自动化构建、测试、部署
#
# 📝 简历亮点：
# - 使用 GitHub Actions 实现自动化 CI/CD
# - 多阶段构建：测试 -> 构建 -> 发布镜像 -> 部署
# - 缓存优化加速构建
#
# 🔥 面试高频：
# Q: CI/CD 的作用是什么？
# A: 1. CI（持续集成）：代码提交后自动运行测试，尽早发现问题
#    2. CD（持续部署/交付）：测试通过后自动部署到环境
#    好处：减少人工操作、快速反馈、保证代码质量
#
# Q: 如何设计一个好的 CI/CD Pipeline？
# A: 1. 快速反馈：优先运行快速测试
#    2. 并行执行：无依赖的 Job 并行运行
#    3. 缓存：缓存依赖加速构建
#    4. 分支策略：不同分支不同 Pipeline
#    5. 安全：敏感信息使用 Secrets
# ========================================================================

name: CI/CD Pipeline

# 触发条件
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  # 手动触发
  workflow_dispatch:

# 环境变量
env:
  GO_VERSION: '1.24'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ========================================================================
  # 阶段1：代码检查（Lint）
  # ========================================================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true # 自动缓存 go mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          args: --timeout=5m

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  # ========================================================================
  # 阶段2：单元测试
  # ========================================================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint # 依赖 lint 阶段
    
    # 启动依赖服务
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123456
          MYSQL_DATABASE: seckill_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run unit tests
        run: |
          go test -v -race -coverprofile=coverage.out ./...
        env:
          MYSQL_HOST: localhost
          MYSQL_PORT: 3306
          REDIS_ADDR: localhost:6379

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.out
          fail_ci_if_error: false

  # ========================================================================
  # 阶段3：构建
  # ========================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        # 构建多个服务
        service: [gateway, user, product, order, seckill]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build service
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build -ldflags="-s -w -X main.Version=${{ github.sha }}" \
          -o bin/${{ matrix.service }}-service \
          ./services/${{ matrix.service }}/main.go

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-service
          path: bin/${{ matrix.service }}-service

  # ========================================================================
  # 阶段4：构建并推送 Docker 镜像
  # ========================================================================
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [gateway, user, product, order, seckill]
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.service }}-service
          path: bin/

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile.${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================================================
  # 阶段5：部署到 Kubernetes（可选）
  # ========================================================================
  deploy:
    name: Deploy to K8s
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production # 需要手动审批

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Update image tags
        run: |
          # 更新 K8s 配置中的镜像版本
          for service in gateway user product order seckill; do
            sed -i "s|image: .*$service.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-$service:${{ github.sha }}|g" \
              deploy/k8s/$service-service.yaml
          done

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f deploy/k8s/

      - name: Wait for rollout
        run: |
          for service in gateway user product order seckill; do
            kubectl rollout status deployment/$service-service --timeout=300s
          done

  # ========================================================================
  # 阶段6：集成测试（部署后）
  # ========================================================================
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run integration tests
        run: |
          k6 run --env BASE_URL=${{ secrets.API_URL }} scripts/k6/api_test.js
        env:
          K6_OUT: json=results.json

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: results.json
