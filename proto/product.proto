syntax = "proto3";

package product;

option go_package = "seckill/proto/product";

// ProductService 商品服务接口
service ProductService {
    // 获取商品列表
    rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);
    // 获取商品详情
    rpc GetProduct(GetProductRequest) returns (GetProductResponse);
    // 获取库存
    rpc GetStock(GetStockRequest) returns (GetStockResponse);
    // 扣减库存（内部调用）
    rpc DeductStock(DeductStockRequest) returns (DeductStockResponse);
    // 创建商品（管理端）
    rpc CreateProduct(CreateProductRequest) returns (CreateProductResponse);
    // 预热库存到 Redis
    rpc WarmUpStock(WarmUpStockRequest) returns (WarmUpStockResponse);
}

message Product {
    uint64 id = 1;
    string name = 2;
    double price = 3;
    double seckill_price = 4;
    int32 stock = 5;
    string description = 6;
    string image_url = 7;
    int64 start_time = 8;  // Unix 时间戳
    int64 end_time = 9;
}

message ListProductsRequest {
    int32 page = 1;
    int32 page_size = 2;
    string keyword = 3;
}

message ListProductsResponse {
    int32 code = 1;
    string message = 2;
    int64 total = 3;
    repeated Product products = 4;
}

message GetProductRequest {
    uint64 product_id = 1;
}

message GetProductResponse {
    int32 code = 1;
    string message = 2;
    Product product = 3;
}

message GetStockRequest {
    uint64 product_id = 1;
}

message GetStockResponse {
    int32 code = 1;
    int32 stock = 2;
}

message DeductStockRequest {
    uint64 product_id = 1;
    int32 quantity = 2;
}

message DeductStockResponse {
    int32 code = 1;
    string message = 2;
    bool success = 3;
}

message CreateProductRequest {
    string name = 1;
    double price = 2;
    double seckill_price = 3;
    int32 stock = 4;
    string description = 5;
    string image_url = 6;
    int64 start_time = 7;
    int64 end_time = 8;
}

message CreateProductResponse {
    int32 code = 1;
    string message = 2;
    uint64 product_id = 3;
}

message WarmUpStockRequest {
    uint64 product_id = 1;
}

message WarmUpStockResponse {
    int32 code = 1;
    string message = 2;
}
