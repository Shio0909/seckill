// Proto 文件是 gRPC 服务的契约，定义了：
// 1. 服务接口（service）- RPC 方法签名
// 2. 消息结构（message）- 请求/响应数据格式

syntax = "proto3";

package user;

option go_package = "seckill/proto/user";

// UserService 用户服务接口定义
service UserService {
    // 用户注册
    rpc Register(RegisterRequest) returns (RegisterResponse);
    // 用户登录
    rpc Login(LoginRequest) returns (LoginResponse);
    // 验证 Token
    rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
    // 获取用户信息
    rpc GetUser(GetUserRequest) returns (GetUserResponse);
}

// 1. 字段编号一旦分配不要改变（向前兼容）
// 2. 使用语义化的字段名
// 3. 预留字段编号给未来扩展

message RegisterRequest {
    string username = 1;
    string password = 2;
    string phone = 3;
}

message RegisterResponse {
    int32 code = 1;
    string message = 2;
    uint64 user_id = 3;
}

message LoginRequest {
    string username = 1;
    string password = 2;
}

message LoginResponse {
    int32 code = 1;
    string message = 2;
    string token = 3;
    uint64 user_id = 4;
}

message ValidateTokenRequest {
    string token = 1;
}

message ValidateTokenResponse {
    bool valid = 1;
    uint64 user_id = 2;
    string username = 3;
}

message GetUserRequest {
    uint64 user_id = 1;
}

message GetUserResponse {
    int32 code = 1;
    string message = 2;
    User user = 3;
}

message User {
    uint64 id = 1;
    string username = 2;
    string phone = 3;
    int64 created_at = 4;
}
